[project]
name = "backend"
version = "0.1.0"
description = "study records backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy",
    "mysql-connector-python",
    "pytest>=9.0.3",
    "httpx>=0.28.1",
    "pymysql>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx"
]

[tool.pytest.ini_options]
pythonpath = "."