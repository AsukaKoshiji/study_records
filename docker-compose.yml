version: '3.9'

services:
  backend:
    build:
      context: ./backend
    container_name: study_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    working_dir: /app
    command: poetry run uvicorn app.main:app --reload --host 0.0.0.0
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: study_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: study_record
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: